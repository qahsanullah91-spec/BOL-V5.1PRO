bundle:
  name: ai-operations-pipeline

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog target catalog
    default: main
  schema:
    description: Target schema for AI pipeline tables
    default: ai_operations

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
