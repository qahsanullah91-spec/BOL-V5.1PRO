      <polygon points="16,-62 4,-64 4,-52 15,-52" fill="#1e1b4b" />

      <!-- Tricycle Landing Gear Extended -->
      <!-- Nose Gear -->
      <g transform="translate(0, 35)">
        <line x1="0" y1="0" x2="0" y2="24" stroke="#1e1b4b" stroke-width="3" />
        <ellipse cx="-5" cy="24" rx="4" ry="7" fill="#1e1b4b" />
        <ellipse cx="5" cy="24" rx="4" ry="7" fill="#1e1b4b" />
      </g>
      <!-- Main Gear Bogies -->
      <g transform="translate(-50, 48)">
        <line x1="0" y1="0" x2="0" y2="28" stroke="#1e1b4b" stroke-width="3" />
        <ellipse cx="-6" cy="28" rx="5" ry="8" fill="#1e1b4b" />
        <ellipse cx="6" cy="28" rx="5" ry="8" fill="#1e1b4b" />
      </g>
      <g transform="translate(50, 48)">
        <line x1="0" y1="0" x2="0" y2="28" stroke="#1e1b4b" stroke-width="3" />
        <ellipse cx="-6" cy="28" rx="5" ry="8" fill="#1e1b4b" />
        <ellipse cx="6" cy="28" rx="5" ry="8" fill="#1e1b4b" />
      </g>

      <!-- Wing Nav Lights -->
      <circle cx="-330" cy="-52" r="5" fill="#ef4444" stroke="#1e1b4b" stroke-width="1.2" /> <!-- Red Port -->
      <circle cx="330" cy="-52" r="5" fill="#22c55e" stroke="#1e1b4b" stroke-width="1.2" />  <!-- Green Starboard -->
    </g>
  
    <g transform="translate(450, 1310)">
      <rect x="-350" y="-18" width="700" height="34" rx="4" fill="#ffffff" fill-opacity="0.96" stroke="#1e1b4b" stroke-width="2" />
      <text x="0" y="-2" font-family="Arial, sans-serif" font-size="10.5" font-weight="900" letter-spacing="3" fill="#1e1b4b" text-anchor="middle">INTERNATIONAL AIR CARGO DISPATCH · FINAL APPROACH ILS CAT III</text>
      <text x="0" y="11" font-family="Courier, monospace" font-size="8" font-weight="bold" fill="#d97706" text-anchor="middle">RWY 29 · GS 3.0° · DH 100 FT · WIND 280°/12KT · FREIGHT HEAVY CLASS 1</text>
    </g>

    <!-- Side HUD Angle-of-Attack Ladder -->
    <g stroke="#0284c7" stroke-width="1.2" opacity="0.75">
      <path d="M120,380 L140,380 L140,400" fill="none" />
      <text x="105" y="384" font-family="Courier, monospace" font-size="8" font-weight="900" fill="#0284c7">+10°</text>
      <path d="M120,440 L150,440" fill="none" />
      <text x="105" y="444" font-family="Courier, monospace" font-size="8" font-weight="900" fill="#0284c7"> 00°</text>
      <path d="M120,500 L140,500 L140,480" fill="none" />
      <text x="105" y="504" font-family="Courier, monospace" font-size="8" font-weight="900" fill="#0284c7">-10°</text>
