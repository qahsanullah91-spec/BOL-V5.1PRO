      <!-- Tower Cab -->
      <polygon points="132,540 148,540 152,525 128,525" fill="#ffffff" stroke="#1e1b4b" stroke-width="1.2" />
      <!-- Radome & Beacon -->
      <circle cx="140" cy="520" r="4" fill="#d97706" stroke="#1e1b4b" stroke-width="1" />
      <line x1="120" y1="510" x2="160" y2="530" stroke="#d97706" stroke-width="1.2" stroke-dasharray="2 2" />
      <text x="140" y="505" font-family="Courier, monospace" font-size="7" font-weight="900" fill="#1e1b4b" text-anchor="middle">ATC TWR</text>
    </g>
  
