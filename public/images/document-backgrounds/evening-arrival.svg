      <circle cx="8" cy="6" r="3.5" fill="#ef4444" />
      <circle cx="18" cy="6" r="3.5" fill="#ef4444" />
      <circle cx="28" cy="6" r="3.5" fill="#ffffff" stroke="#1e1b4b" stroke-width="0.8" />
      <circle cx="38" cy="6" r="3.5" fill="#ffffff" stroke="#1e1b4b" stroke-width="0.8" />
      <text x="-8" y="9" font-family="Courier, monospace" font-size="7" font-weight="900" fill="#1e1b4b" text-anchor="end">PAPI 3.0°</text>
    </g>
  
