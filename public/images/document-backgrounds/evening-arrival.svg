      <line x1="450" y1="785" x2="450" y2="820" stroke-width="3.8" />
      <line x1="450" y1="845" x2="450" y2="895" stroke-width="4.6" />
      <line x1="450" y1="925" x2="450" y2="990" stroke-width="5.5" />
