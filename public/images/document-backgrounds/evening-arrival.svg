    <g stroke="#d97706" stroke-width="1.4" opacity="0.85">
      <line x1="420" y1="620" x2="230" y2="1340" stroke-width="2.5" />
      <line x1="480" y1="620" x2="670" y2="1340" stroke-width="2.5" />
