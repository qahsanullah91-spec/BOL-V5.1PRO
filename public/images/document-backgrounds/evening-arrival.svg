      <polygon points="0,0 280,-70 325,-65 330,-50 40,55 0,60 -40,55 -330,-50 -325,-65 -280,-70" fill="#1e1b4b" fill-opacity="0.18" stroke="#1e1b4b" stroke-width="3.2" />

