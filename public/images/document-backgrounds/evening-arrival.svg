        <ellipse cx="0" cy="0" rx="16" ry="20" fill="#1e1b4b" fill-opacity="0.25" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="0" cy="0" r="6" fill="#1e1b4b" />
        <!-- Pylon strut -->
        <rect x="-3" y="-32" width="6" height="14" fill="#1e1b4b" />
      </g>

      <!-- Fuselage Centerline & Nose Radome -->
      <path d="M-36,55 C-36,20 -32,-40 0,-100 C32,-40 36,20 36,55 C36,75 22,85 0,85 C-22,85 -36,75 -36,55 Z" fill="#ffffff" stroke="#1e1b4b" stroke-width="3.5" />

      <!-- Cockpit Windshield Windows -->
