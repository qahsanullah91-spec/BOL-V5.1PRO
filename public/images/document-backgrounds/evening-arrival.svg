      <line x1="140" y1="28" x2="135" y2="58" stroke="#1e1b4b" stroke-width="2" />
      <line x1="200" y1="12" x2="195" y2="44" stroke="#1e1b4b" stroke-width="2" />

      <line x1="-80" y1="45" x2="-75" y2="72" stroke="#1e1b4b" stroke-width="2" />
      <line x1="-140" y1="28" x2="-135" y2="58" stroke="#1e1b4b" stroke-width="2" />
      <line x1="-200" y1="12" x2="-195" y2="44" stroke="#1e1b4b" stroke-width="2" />

      <!-- High-Bypass Turbofan Engines (Left: x=-110, Right: x=110) -->
      <!-- Left Engine -->
      <g transform="translate(-110, 20)">
        <ellipse cx="0" cy="0" rx="22" ry="26" fill="#ffffff" stroke="#1e1b4b" stroke-width="3" />
        <ellipse cx="0" cy="0" rx="16" ry="20" fill="#1e1b4b" fill-opacity="0.25" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="0" cy="0" r="6" fill="#1e1b4b" />
        <!-- Pylon strut -->
