<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="100%" height="100%">
  <title>Air Cargo Freighter Aircraft Blueprint — Sky Ariana Aviation</title>
  <defs>
    <!-- Technical Blueprint Engineering Grid -->
    <pattern id="cadGridMajorAir" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#0369a1" stroke-width="0.8" stroke-opacity="0.35" />
    </pattern>
    <pattern id="cadGridMinorAir" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#38bdf8" stroke-width="0.35" stroke-opacity="0.2" />
    </pattern>
    <linearGradient id="blueprintBgAir" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="20%" stop-color="#f0f9ff" />
      <stop offset="70%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="fuselageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Technical Blueprint Background Paper & Multi-Scale Grid -->
  <rect width="900" height="1400" fill="url(#blueprintBgAir)" />
  <rect width="900" height="1400" fill="url(#cadGridMinorAir)" />
  <rect width="900" height="1400" fill="url(#cadGridMajorAir)" />

  <!-- Perimeter Security & Architectural CAD Border -->
  <g fill="none" stroke="#0369a1">
    <rect x="24" y="24" width="852" height="1352" stroke-width="2" stroke-opacity="0.75" />
    <rect x="34" y="34" width="832" height="1332" stroke-width="0.8" stroke-dasharray="6 3" stroke-opacity="0.5" />
    <rect x="42" y="42" width="816" height="1316" stroke-width="0.5" stroke-opacity="0.3" />

    <!-- Corner Registration Crosshairs & Dimension Ticks -->
    <path d="M16,40 L16,16 L40,16" stroke-width="2.5" stroke-opacity="0.8" />
    <path d="M884,40 L884,16 L860,16" stroke-width="2.5" stroke-opacity="0.8" />
    <path d="M16,1360 L16,1384 L40,1384" stroke-width="2.5" stroke-opacity="0.8" />
    <path d="M884,1360 L884,1384 L860,1384" stroke-width="2.5" stroke-opacity="0.8" />

    <!-- Axis Coordinate Calibrations -->
    <text x="450" y="20" font-family="monospace" font-size="8" font-weight="bold" letter-spacing="3" text-anchor="middle" fill="#0369a1">SECURE AERONAUTICAL CAD BLUEPRINT // SKY FREIGHT AIR CARGO SPECIFICATION</text>
    <text x="450" y="1390" font-family="monospace" font-size="8" font-weight="bold" letter-spacing="3" text-anchor="middle" fill="#0369a1">SKY ARIANA LOGISTICS // INTERNATIONAL AIR WAYBILL CARGO CERTIFICATE</text>
  </g>

  <!-- Top Section: Plan View (Top-Down Wing & Fuselage Geometry - FIG 01) -->
  <g transform="translate(60, 160)">
    <text x="15" y="-12" font-family="monospace" font-size="9" font-weight="bold" fill="#0369a1" stroke="none">FIG. 01 — PLAN VIEW (AERODYNAMIC SWEEP &amp; MAIN DECK CAPACITY)</text>

    <!-- Center Fuselage Axis Line -->
    <line x1="120" y1="100" x2="680" y2="100" stroke="#0284c7" stroke-width="0.8" stroke-dasharray="8 3" />

    <!-- Port & Starboard Wings in Plan View -->
    <!-- Starboard Wing (Top) -->
    <path d="M 330 100 L 460 20 L 510 20 L 410 100 Z" fill="url(#fuselageGrad)" stroke="#0369a1" stroke-width="2" />
    <rect x="415" y="38" width="30" height="15" rx="3" fill="#38bdf8" fill-opacity="0.7" stroke="#0369a1" stroke-width="1.5" />
    <!-- Port Wing (Bottom) -->
    <path d="M 330 100 L 460 180 L 510 180 L 410 100 Z" fill="url(#fuselageGrad)" stroke="#0369a1" stroke-width="2" />
    <rect x="415" y="147" width="30" height="15" rx="3" fill="#38bdf8" fill-opacity="0.7" stroke="#0369a1" stroke-width="1.5" />

    <!-- Horizontal Stabilizers at Tail -->
    <path d="M 620 100 L 670 65 L 685 65 L 650 100 Z" fill="url(#fuselageGrad)" stroke="#0369a1" stroke-width="1.8" />
    <path d="M 620 100 L 670 135 L 685 135 L 650 100 Z" fill="url(#fuselageGrad)" stroke="#0369a1" stroke-width="1.8" />

    <!-- Main Fuselage Body -->
    <path d="M 160 100 Q 180 82 230 82 L 620 82 Q 670 90 680 100 Q 670 110 620 118 L 230 118 Q 180 118 160 100 Z" fill="url(#fuselageGrad)" stroke="#0369a1" stroke-width="2.5" />
    
    <!-- Nose Cockpit Radar Radome -->
    <path d="M 160 100 Q 170 90 190 90 L 190 110 Q 170 110 160 100 Z" fill="#93c5fd" stroke="#0369a1" stroke-width="1.5" />

    <!-- Dimensions Plan Line -->
    <line x1="160" y1="195" x2="680" y2="195" stroke="#0284c7" stroke-width="1" />
    <line x1="160" y1="189" x2="160" y2="201" stroke="#0284c7" stroke-width="1" />
    <line x1="680" y1="189" x2="680" y2="201" stroke="#0284c7" stroke-width="1" />
    <text x="420" y="208" font-family="monospace" font-size="8.5" font-weight="bold" fill="#0369a1" text-anchor="middle">OVERALL LENGTH: 70.6 METERS // WINGSPAN: 64.8 METERS</text>
  </g>

  <!-- Mid Section: Side Elevation Profile & Cargo Loading Deck (FIG 02) -->
  <g transform="translate(60, 420)">
    <text x="15" y="-15" font-family="monospace" font-size="11" font-weight="bold" fill="#0369a1" stroke="none">FIG. 02 — SIDE PROFILE ELEVATION &amp; CARGO HANDLING CLEARANCES</text>

    <!-- Cargo Aircraft Main Body Profile -->
    <path d="M 60 220 Q 80 160 140 160 L 220 160 Q 250 160 270 180 L 640 180 Q 720 190 750 215 L 750 225 Q 710 240 640 240 L 140 240 Q 80 240 60 220 Z" fill="url(#fuselageGrad)" stroke="#0369a1" stroke-width="3" />
    
    <!-- Cockpit Flight Deck Windows (Upper Hump) -->
    <path d="M 140 168 L 180 168 L 190 182 L 130 182 Z" fill="#38bdf8" fill-opacity="0.8" stroke="#0369a1" stroke-width="1.5" />
    
    <!-- Nose Cargo Door Hinged Opening Arc (CAD Motion Callout) -->
    <path d="M 60 220 Q 75 140 120 120" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 3" fill="none" />
    <path d="M 120 120 L 115 130 L 130 123 Z" fill="#dc2626" stroke="none" />
    <text x="135" y="125" font-family="monospace" font-size="8" font-weight="bold" fill="#dc2626">NOSE CARGO DOOR (90° SWING)</text>

    <!-- Main Deck Cargo Loading Door (Side Aft) -->
    <rect x="230" y="185" width="45" height="50" rx="2" fill="#bfdbfe" fill-opacity="0.6" stroke="#0369a1" stroke-width="2" stroke-dasharray="4 2" />
    <text x="252" y="213" font-family="monospace" font-size="6.5" font-weight="bold" fill="#0369a1" text-anchor="middle">MAIN DOOR</text>

    <!-- Lower Deck Forward & Aft Cargo Doors -->
    <rect x="150" y="222" width="30" height="15" rx="1" fill="#bae6fd" stroke="#0369a1" stroke-width="1.5" />
    <rect x="520" y="222" width="30" height="15" rx="1" fill="#bae6fd" stroke="#0369a1" stroke-width="1.5" />

    <!-- Vertical Stabilizer & Rudder -->
    <path d="M 640 180 L 730 40 L 770 40 L 740 215 Z" fill="url(#fuselageGrad)" stroke="#0369a1" stroke-width="3" />
    <path d="M 730 40 L 750 40 L 735 210 L 720 210 Z" fill="#93c5fd" fill-opacity="0.7" stroke="#0284c7" stroke-width="1.5" />
    <!-- Tail Navigation Strobe Beacon -->
    <circle cx="750" cy="38" r="4" fill="#dc2626" />

    <!-- Wing & High-Bypass Turbofan Engine (Side View) -->
    <g transform="translate(320, 210)">
      <!-- Engine Pylon -->
      <polygon points="40,-10 60,-10 50,15 30,15" fill="#0369a1" />
      <!-- Turbofan Cowling -->
      <rect x="10" y="15" width="85" height="36" rx="6" fill="#ffffff" stroke="#0369a1" stroke-width="2.5" />
      <path d="M 10 15 L 20 25 L 20 41 L 10 51 Z" fill="#0284c7" />
      <!-- Exhaust Cone -->
      <path d="M 95 24 L 115 33 L 95 42 Z" fill="#475569" stroke="#0369a1" stroke-width="1.5" />
      <line x1="25" y1="33" x2="90" y2="33" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 2" />
    </g>

    <!-- Main Landing Gear Bogies & Nose Gear -->
    <!-- Nose Gear Assembly -->
    <g transform="translate(130, 240)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#0369a1" stroke-width="3" />
      <circle cx="-8" cy="40" r="10" fill="#ffffff" stroke="#0369a1" stroke-width="2.5" />
      <circle cx="8" cy="40" r="10" fill="#ffffff" stroke="#0369a1" stroke-width="2.5" />
    </g>
    <!-- Main Center Gear Bogie -->
    <g transform="translate(420, 240)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#0369a1" stroke-width="3.5" />
      <circle cx="-16" cy="40" r="12" fill="#ffffff" stroke="#0369a1" stroke-width="2.5" />
      <circle cx="0" cy="40" r="12" fill="#ffffff" stroke="#0369a1" stroke-width="2.5" />
      <circle cx="16" cy="40" r="12" fill="#ffffff" stroke="#0369a1" stroke-width="2.5" />
    </g>

    <!-- Runway Baseline Ground Line -->
    <line x1="30" y1="292" x2="770" y2="292" stroke="#0284c7" stroke-width="2" />
    <line x1="30" y1="296" x2="770" y2="296" stroke="#0284c7" stroke-width="0.8" stroke-dasharray="10 6" />

    <!-- Dimension Callouts -->
    <g stroke="#0284c7" stroke-width="1.2" fill="none">
      <line x1="25" y1="40" x2="25" y2="292" />
      <line x1="18" y1="40" x2="32" y2="40" /><line x1="18" y1="292" x2="32" y2="292" />
      <text x="-5" y="170" font-family="monospace" font-size="9" font-weight="bold" fill="#0369a1" transform="rotate(-90,-5,170)" stroke="none">TAIL HEIGHT: 19.4 METERS</text>
      
      <line x1="60" y1="315" x2="750" y2="315" />
      <line x1="60" y1="307" x2="60" y2="323" /><line x1="750" y1="307" x2="750" y2="323" />
      <text x="405" y="333" font-family="monospace" font-size="9" font-weight="bold" fill="#0369a1" text-anchor="middle" stroke="none">MAX TAKEOFF WEIGHT (MTOW): 397,000 KG // PAYLOAD: 104,000 KG</text>
    </g>
  </g>

  <!-- Lower Section: International Air Cargo Corridors (FIG 03) -->
  <g transform="translate(60, 860)">
    <rect x="0" y="0" width="780" height="180" rx="4" fill="#ffffff" fill-opacity="0.85" stroke="#0369a1" stroke-width="1.5" />
    <text x="15" y="24" font-family="monospace" font-size="11" font-weight="black" fill="#0369a1">FIG. 03 — GLOBAL AIR FREIGHT CORRIDORS &amp; TRANSIT FLIGHT PATHS</text>
    
    <g stroke="#0284c7" stroke-width="2" fill="none">
      <path d="M 60 95 Q 150 45 230 75 T 410 115 T 570 65 T 720 95" stroke-dasharray="6 3" />
    </g>

    <g transform="translate(60, 95)">
      <circle cx="0" cy="0" r="12" fill="#bae6fd" stroke="#0369a1" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#0369a1" />
      <text x="0" y="26" font-family="monospace" font-size="8.5" font-weight="bold" fill="#0369a1" text-anchor="middle">DUBAI (DXB/DWC)</text>
      <text x="0" y="38" font-family="monospace" font-size="7" fill="#0284c7" text-anchor="middle">TRANSIT AIR HUB</text>
    </g>

    <g transform="translate(230, 75)">
      <circle cx="0" cy="0" r="12" fill="#bae6fd" stroke="#0369a1" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#0369a1" />
      <text x="0" y="26" font-family="monospace" font-size="8.5" font-weight="bold" fill="#0369a1" text-anchor="middle">ISTANBUL (IST)</text>
      <text x="0" y="38" font-family="monospace" font-size="7" fill="#0284c7" text-anchor="middle">EUROPE GATEWAY</text>
    </g>

    <g transform="translate(410, 115)">
      <circle cx="0" cy="0" r="12" fill="#bae6fd" stroke="#0369a1" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#0369a1" />
      <text x="0" y="26" font-family="monospace" font-size="8.5" font-weight="bold" fill="#0369a1" text-anchor="middle">KABUL (KBL/OAKB)</text>
      <text x="0" y="38" font-family="monospace" font-size="7" fill="#0284c7" text-anchor="middle">SKY BASE MAIN</text>
    </g>

    <g transform="translate(570, 65)">
      <circle cx="0" cy="0" r="12" fill="#bae6fd" stroke="#0369a1" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#0369a1" />
      <text x="0" y="26" font-family="monospace" font-size="8.5" font-weight="bold" fill="#0369a1" text-anchor="middle">TASHKENT (TAS)</text>
      <text x="0" y="38" font-family="monospace" font-size="7" fill="#0284c7" text-anchor="middle">CENTRAL ASIA HUB</text>
    </g>

    <g transform="translate(720, 95)">
      <circle cx="0" cy="0" r="12" fill="#bae6fd" stroke="#0369a1" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#0369a1" />
      <text x="0" y="26" font-family="monospace" font-size="8.5" font-weight="bold" fill="#0369a1" text-anchor="middle">DELHI (DEL)</text>
      <text x="0" y="38" font-family="monospace" font-size="7" fill="#0284c7" text-anchor="middle">SOUTH ASIA DOCK</text>
    </g>

    <line x1="0" y1="150" x2="780" y2="150" stroke="#bae6fd" stroke-width="1" />
    <text x="390" y="168" font-family="monospace" font-size="8" font-weight="bold" fill="#0369a1" text-anchor="middle">IATA RECOGNIZED AIR WAYBILL ROUTING // MULTI-MODAL LOGISTICS ACCREDITED</text>
  </g>

  <!-- Bottom Section: Engineering Title Block (ICAO / ISO Standard) -->
  <g transform="translate(60, 1070)" stroke="#0369a1" stroke-width="1.5" fill="none">
    <rect width="780" height="260" fill="#ffffff" fill-opacity="0.95" />
    
    <line x1="0" y1="50" x2="780" y2="50" />
    <line x1="0" y1="110" x2="780" y2="110" />
    <line x1="0" y1="170" x2="780" y2="170" />
    
    <line x1="260" y1="50" x2="260" y2="260" />
    <line x1="520" y1="50" x2="520" y2="260" />

    <text x="20" y="34" font-family="monospace" font-size="16" font-weight="black" fill="#0369a1" stroke="none">SKY ARIANA AIR CARGO FREIGHTER SYSTEM</text>
    <text x="760" y="34" font-family="monospace" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="end" stroke="none">DWG: BOL-AIR-900-V5</text>

    <!-- Cell (1,1) -->
    <g transform="translate(15, 60)" stroke="none">
      <text x="0" y="16" font-family="monospace" font-size="8.5" font-weight="bold" fill="#64748b">AIRCRAFT CATEGORY:</text>
      <text x="0" y="32" font-family="monospace" font-size="10" font-weight="bold" fill="#1e293b">HEAVY FREIGHTER (WIDEBODY)</text>
      <text x="0" y="44" font-family="monospace" font-size="9" fill="#0284c7">ICAO AIRWORTHINESS CERTIFIED</text>
    </g>

    <!-- Cell (1,2) -->
    <g transform="translate(275, 60)" stroke="none">
      <text x="0" y="16" font-family="monospace" font-size="8.5" font-weight="bold" fill="#64748b">MAX STRUCTURAL PAYLOAD:</text>
      <text x="0" y="32" font-family="monospace" font-size="10" font-weight="bold" fill="#1e293b">104,000 KG (229,000 LBS)</text>
      <text x="0" y="44" font-family="monospace" font-size="9" fill="#0284c7">CARGO VOLUME: 653 m³</text>
    </g>

    <!-- Cell (1,3) -->
    <g transform="translate(535, 60)" stroke="none">
      <text x="0" y="16" font-family="monospace" font-size="8.5" font-weight="bold" fill="#64748b">PALLET CONFIGURATION:</text>
      <text x="0" y="32" font-family="monospace" font-size="10" font-weight="bold" fill="#1e293b">30 MAIN DECK + 10 LOWER</text>
      <text x="0" y="44" font-family="monospace" font-size="9" fill="#0284c7">STANDARD 96x125 INCH</text>
    </g>

    <!-- Cell (2,1) -->
    <g transform="translate(15, 120)" stroke="none">
      <text x="0" y="16" font-family="monospace" font-size="8.5" font-weight="bold" fill="#64748b">SERVICE CEILING / RANGE:</text>
      <text x="0" y="32" font-family="monospace" font-size="10" font-weight="bold" fill="#1e293b">FL 430 // 9,200 KM</text>
      <text x="0" y="44" font-family="monospace" font-size="9" fill="#0284c7">INTERCONTINENTAL FLIGHT</text>
    </g>

    <!-- Cell (2,2) -->
    <g transform="translate(275, 120)" stroke="none">
      <text x="0" y="16" font-family="monospace" font-size="8.5" font-weight="bold" fill="#64748b">SECURITY CLASSIFICATION:</text>
      <text x="0" y="32" font-family="monospace" font-size="10" font-weight="bold" fill="#1e293b">ICAO ANNEX 17 SECURE</text>
      <text x="0" y="44" font-family="monospace" font-size="9" fill="#16a34a">VERIFIED &amp; COMPLIANT</text>
    </g>

    <!-- Cell (2,3) -->
    <g transform="translate(535, 120)" stroke="none">
      <text x="0" y="16" font-family="monospace" font-size="8.5" font-weight="bold" fill="#64748b">AEROSPACE CAD SCALE:</text>
      <text x="0" y="32" font-family="monospace" font-size="10" font-weight="bold" fill="#1e293b">1:200 ARCH / CAD REV 5</text>
      <text x="0" y="44" font-family="monospace" font-size="9" fill="#0284c7">A4 PORTRAIT SPECIFICATION</text>
    </g>

    <!-- Cell (3) -->
    <g transform="translate(15, 180)" stroke="none">
      <text x="0" y="22" font-family="monospace" font-size="9" font-weight="bold" fill="#64748b">AUTHORIZATION &amp; FLIGHT OPS STAMP:</text>
      <text x="0" y="42" font-family="monospace" font-size="11" font-weight="black" fill="#0369a1">SKY ARIANA AIR CARGO — OFFICIAL WATERMARK ASSET</text>
      <text x="0" y="58" font-family="monospace" font-size="8" fill="#475569">COPYRIGHT © 2026 SKY ARIANA. ALL RIGHTS RESERVED. FOR OFFICIAL AIR WAYBILL DISPATCH USE ONLY.</text>
    </g>
    <g transform="translate(680, 185)" stroke="none">
      <circle cx="45" cy="35" r="30" fill="none" stroke="#dc2626" stroke-width="2" stroke-opacity="0.75" />
      <text x="45" y="33" font-family="monospace" font-size="7.5" font-weight="bold" fill="#dc2626" text-anchor="middle">APPROVED</text>
      <text x="45" y="44" font-family="monospace" font-size="6.5" font-weight="bold" fill="#dc2626" text-anchor="middle">CAD AIR-03</text>
    </g>
  </g>
</svg>
