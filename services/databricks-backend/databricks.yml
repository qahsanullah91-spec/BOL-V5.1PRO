bundle:
  name: sky-databricks-backend-bundle

resources:
  apps:
    sky_databricks_backend:
      name: sky-databricks-backend
      source_code_path: .
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: 1234567890abcdef
            permission: CAN_USE

        - name: database
          database:
            name: app_transaction_db
            permission: CAN_CONNECT_AND_CREATE

        - name: serving-endpoint
          serving_endpoint:
            name: databricks-meta-llama-3-3-70b-instruct
            permission: CAN_QUERY

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
